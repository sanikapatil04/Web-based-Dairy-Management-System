<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login with Mobile</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: url('login.jpg') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.35);
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .logo {
      width: 320px;
      height: auto;
      margin-bottom: 25px;
      object-fit: contain;
    }

    .quote {
      font-size: 30px;
      color: white;
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      margin-bottom: 40px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
      animation: fadeZoom 1.3s ease-in-out forwards;
      opacity: 0;
    }

    @keyframes fadeZoom {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    .login-box {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 2rem 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      animation: floatBox 3s ease-in-out infinite, fadeInBox 1s ease forwards;
      opacity: 0;
    }

    @keyframes floatBox {
      0% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0); }
    }

    @keyframes fadeInBox {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #444;
      font-weight: 600;
      text-align: left;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    input[type="text"]:focus {
      border-color: #5b7cfa;
      outline: none;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #5b7cfa;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #405ce3;
    }

    #otpBlock {
      margin-top: 1.5rem;
    }

    /* Responsive styles */
    @media (max-width: 768px) {
      .logo {
        width: 130px;
      }

      .quote {
        font-size: 20px;
        padding: 0 15px;
      }

      .login-box {
        width: 85%;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- Logo -->
    <img src="logo.png" alt="Dairy Logo" class="logo">

    <!-- Quote -->
    <div class="quote">
      Every glass of Milk reflects the dedication of Farmers
    </div>

    <!-- Animated Login Box -->
    <div class="login-box">
      <h2>Login</h2>

      <!-- Send OTP Form -->
      <form id="sendOtpForm">
        <label for="mobile">Mobile Number</label>
        <input type="text" id="mobile" required>
        <button type="submit">Send OTP</button>
      </form>

      <!-- Verify OTP Form -->
      <div id="otpBlock" style="display:none;">
        <form id="verifyOtpForm">
          <label for="otp">Enter OTP</label>
          <input type="text" id="otp" placeholder="Enter OTP" required>
          <button type="submit">Verify OTP</button>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
